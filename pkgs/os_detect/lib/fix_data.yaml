version: 1
transforms:
  # Top-level getters in package:os_detect
  - title: 'Replace with HostPlatform.current.isAndroid'
    date: 2026-07-10
    element:
      uris: ['package:os_detect/os_detect.dart']
      getter: 'isAndroid'
    changes:
      - kind: 'replacedBy'
        newElement:
          uris: ['package:platform/platform.dart']
          getter: 'current.isAndroid'
          inClass: 'Platform'

